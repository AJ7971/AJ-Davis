<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Study Planner & Grade Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Student Study Planner & Grade Dashboard (v2)</h1>
  </header>
  <main>
    <aside id="dashboard" class="card">
      <h2>Dashboard</h2>
      <div class="stat-row"><div>Total</div><div id="stat-total">0</div></div>
      <div class="stat-row"><div>Completed</div><div id="stat-completed">0</div></div>
      <div class="stat-row"><div>Remaining</div><div id="stat-remaining">0</div></div>
      <div class="stat-row"><div>Overdue</div><div id="stat-overdue">0</div></div>
      <div class="stat-row"><div>Average (graded)</div><div id="stat-average">—</div></div>

      <hr />
      <div class="controls">
        <label>Filter: <select id="filter-status"><option value="all">All</option><option value="unfinished">Unfinished</option><option value="complete">Complete</option></select></label>
        <label>Sort: <select id="sort-by"><option value="due">Due date</option><option value="priority">Priority</option><option value="created">Created</option></select></label>
      </div>
    </aside>

    <section id="courses-section" class="card">
      <h2>Courses</h2>
      <form id="course-form">
        <input type="hidden" id="course-id" />
        <input id="course-name" placeholder="Course name" required />
        <button type="submit">Add Course</button>
      </form>
      <ul id="courses-list"></ul>
    </section>

    <section id="assignments-section" class="card">
      <h2>Assignments</h2>
      <form id="assignment-form">
        <input type="hidden" id="assignment-id" />
        <input id="assignment-title" placeholder="Title" required />
        <select id="assignment-course"></select>
        <input id="assignment-due" type="date" />
        <select id="assignment-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <select id="assignment-status">
          <option value="unfinished">Unfinished</option>
          <option value="complete">Complete</option>
        </select>
        <input id="assignment-grade" type="number" step="0.1" placeholder="Grade (optional)" style="width:110px" />
        <button type="submit">Add Assignment</button>
      </form>

      <ul id="assignments-list"></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
